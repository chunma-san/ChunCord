name: Test Patches
on:
    workflow_dispatch:
        inputs:
            discord_branch:
                type: choice
                description: "Discord Branch to test patches on"
                options:
                    - both
                    - stable
                    - canary
                default: both
            webhook_url:
                type: string
                description:
                    "Webhook URL that the report will be posted to. This will be
                    visible for everyone, so DO NOT pass sensitive webhooks like
                    discord webhook. This is meant to be used by Equibot."
                required: false
            repository:
                type: string
                description: repository to test patches on
                required: false
            ref:
                type: string
                description: "Git reference to test patches on. This can be a branch, tag, or commit SHA."
                required: false
    schedule:
        #   # Every day at midnight
        - cron: 0 0 * * *

env:
    FORCE_COLOR: true

permissions:
    contents: read

jobs:
    TestPlugins:
        name: Test Patches (${{ matrix.discord_branch }})
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                discord_branch: ${{ fromJSON(inputs.discord_branch == 'stable' && '["stable"]' || inputs.discord_branch == 'canary' && '["canary"]' || '["stable", "canary"]') }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  repository: ${{ inputs.repository || github.repository }}
                  ref: ${{ inputs.ref || github.event.repository.default_branch }}
                  persist-credentials: false

            - name: Setup PNPM
              uses: pnpm/setup@ce3b1e5f04cd26dbb4614172464b544b5633cc92
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Install dependencies
              run: |
                  pnpm install --frozen-lockfile --prefer-offline

            - name: Build ChunCord Reporter Version
              run: pnpm buildReporter

            - name: Run Reporter
              timeout-minutes: 10
              run: |
                  export PATH="$PWD/node_modules/.bin:$PATH"
                  export CHROMIUM_BIN=/usr/bin/google-chrome

                  esbuild scripts/generateReport.ts --bundle --platform=node --packages=external --format=esm > dist/report.mjs

                  report_file=$(mktemp)
                  exit_code=0
                  node dist/report.mjs > "$report_file" || exit_code=$?
                  cat "$report_file" >> "$GITHUB_STEP_SUMMARY"
                  exit $exit_code
              env:
                  USE_CANARY: ${{ matrix.discord_branch == 'canary' && 'true' || 'false' }}
                  # Scheduled fork reports stay in the GitHub job summary.
                  WEBHOOK_URL: ${{ inputs.webhook_url }}
            - name: Preserve patch report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: patch-report-${{ matrix.discord_branch }}
                  path: |
                      dist/patch-report-*.json
                      dist/patch-module-sources-*.json
                  if-no-files-found: warn
                  retention-days: 7
