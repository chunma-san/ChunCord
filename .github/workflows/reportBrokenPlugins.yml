name: Test Patches
on:
    workflow_dispatch:
        inputs:
            discord_branch:
                type: choice
                description: "Discord Branch to test patches on"
                options:
                    - both
                    - stable
                    - canary
                default: both
            webhook_url:
                type: string
                description:
                    "Webhook URL that the report will be posted to. This will be
                    visible for everyone, so DO NOT pass sensitive webhooks like
                    discord webhook. This is meant to be used by Equibot."
                required: false
            repository:
                type: string
                description: repository to test patches on
                required: false
            ref:
                type: string
                description: "Git reference to test patches on. This can be a branch, tag, or commit SHA."
                required: false
    schedule:
        #   # Every day at midnight
        - cron: 0 0 * * *

env:
    FORCE_COLOR: true

permissions:
    contents: read

jobs:
    TestPlugins:
        name: Test Patches
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  repository: ${{ inputs.repository || github.repository }}
                  ref: ${{ inputs.ref || github.event.repository.default_branch }}
                  persist-credentials: false

            - name: Setup PNPM
              uses: pnpm/setup@ce3b1e5f04cd26dbb4614172464b544b5633cc92
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Install dependencies
              run: |
                  pnpm install --frozen-lockfile --prefer-offline

            - name: Build ChunCord Reporter Version
              run: pnpm buildReporter

            - name: Run Reporter
              timeout-minutes: 10
              run: |
                  export PATH="$PWD/node_modules/.bin:$PATH"
                  export CHROMIUM_BIN=/usr/bin/google-chrome

                  esbuild scripts/generateReport.ts > dist/report.mjs

                  stable_output_file=$(mktemp)
                  canary_output_file=$(mktemp)

                  pids=""

                  branch="$DISCORD_BRANCH"

                  if [[ "$branch" = "both" || "$branch" = "stable" ]]; then
                    node dist/report.mjs > "$stable_output_file" &
                    pids+=" $!"
                  fi

                  if [[ "$branch" = "both" || "$branch" = "canary" ]]; then
                    USE_CANARY=true node dist/report.mjs > "$canary_output_file" &
                    pids+=" $!"
                  fi

                  exit_code=0
                  for pid in $pids; do
                      if ! wait "$pid"; then
                        exit_code=1
                      fi
                  done

                  cat "$stable_output_file" "$canary_output_file" >> $GITHUB_STEP_SUMMARY
                  exit $exit_code
              env:
                  DISCORD_BRANCH: ${{ inputs.discord_branch || 'both' }}
                  # Scheduled fork reports stay in the GitHub job summary.
                  WEBHOOK_URL: ${{ inputs.webhook_url }}
